# Versioned Codex config (portable settings only). Codex appends
# machine-specific [projects.*] trust entries at runtime - leave those
# uncommitted.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
plan_mode_reasoning_effort = "xhigh"

[tui]
theme = "nord"
status_line = ["model-with-reasoning", "context-used", "current-dir"]

[features]
hooks = true

[projects."/home/mfernandezpranno/code/dotfiles"]
trust_level = "trusted"

[projects."/home/mfernandezpranno/code/sigmund"]
trust_level = "trusted"

[projects."/home/mfernandezpranno"]
trust_level = "trusted"

[projects."/Users/mfernandezpranno/Code/dotfiles"]
trust_level = "trusted"

[notice]
hide_full_access_warning = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
